# GitVersion configuration for QuestLog.
# Docs: https://gitversion.net/docs/reference/configuration
#
# Branching model (GitFlow):
#   master              -> production releases            e.g. 1.2.0
#   development         -> next release, pre-released     e.g. 1.3.0-alpha.5
#   release/*           -> release stabilisation          e.g. 1.3.0-beta.1
#   feature/*, fix/*    -> in-progress work               e.g. 1.3.0-my-feature.2
#
# The version is inferred from the commit history, so it never has to be
# hand-edited in a .csproj. Bump the version explicitly by adding one of the
# following to a commit message:
#   +semver: major | breaking
#   +semver: minor | feature
#   +semver: patch | fix
#   +semver: none  | skip
workflow: GitFlow/v1

# The repository has no tags yet, so this seeds the first release. Once a tag
# exists that is greater than this value, the tag wins and this is ignored.
next-version: 0.1.0

# Release tags are plain "0.1.0", but a leading "v" is also accepted.
tag-prefix: '[vV]?'

assembly-versioning-scheme: MajorMinorPatch
assembly-file-versioning-scheme: MajorMinorPatch

branches:
  # "fix/*" is used in this repository alongside GitFlow's "hotfix/*".
  # Unlike a hotfix it branches off development and only ever bumps the patch.
  fix:
    mode: ManualDeployment
    label: '{BranchName}'
    increment: Patch
    prevent-increment:
      when-current-commit-tagged: false
    track-merge-message: true
    regex: ^fix(es)?[/-](?<BranchName>.+)
    source-branches:
      - develop
      - main
      - release
      - support
      - hotfix
    is-source-branch-for: []
    is-main-branch: false
    pre-release-weight: 30000

  # Teach the built-in branches that work can also arrive from a "fix/*" branch.
  pull-request:
    source-branches:
      - develop
      - main
      - release
      - feature
      - fix
      - support
      - hotfix

  unknown:
    source-branches:
      - main
      - develop
      - release
      - feature
      - fix
      - pull-request
      - hotfix
      - support

ignore:
  sha: []
