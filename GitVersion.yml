workflow: GitHubFlow/v1

commit-message-incrementing: MergeMessageOnly

tag-prefix: "[vV]?"

branches:
  master:
    mode: ContinuousDeployment
    is-main-branch: true
    regex: master

  develop:
    regex: ^dev(elop)?(elopment)?$
    source-branches:
      - master
    increment: Patch
    label: alpha

  feature:
    increment: Minor

  fix:
    regex: ^fix[/-](?<BranchName>.+)
    source-branches:
      - develop
    increment: Inherit
    label: "fix-{BranchName}"

  hotfix:
    regex: ^hotfix(es)?[/-](?<BranchName>.+)
    source-branches:
      - master
    increment: Patch
    label: "hotfix-{BranchName}"
