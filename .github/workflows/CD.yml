name: Continuous Delivery

on:
  push:
    branches:
      - master
      - development
    paths: 
      - '**.cs'
      - '**.csproj'
      - '**.axaml'
    tags:
      - "*.*.*"
    
jobs:
  build-and-release:
    runs-on: windows-latest
    concurrency:
      group: cd-release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
      checks: write
      statuses: write
      actions: write
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 6
          cache: true
          cache-dependency-path: QuestLog.GUI/packages.lock.json

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.x"
          
      - name: Determine GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          configFilePath: GitVersion.yml

      - name: Print version
        run: |
          echo "GITVERSION_FULLSEMVER=${{ steps.gitversion.outputs.FullSemVer }}" >> $GITHUB_ENV
          echo "GITVERSION_SEMVER=${{ steps.gitversion.outputs.SemVer }}" >> $GITHUB_ENV
          echo "GITVERSION_ASSEMBLYSEMVER=${{ steps.gitversion.outputs.assemblySemVer }}" >> $GITHUB_ENV

      - name: Determine release name
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $releaseName = "${{ github.ref_name }}"
          } elseif ("${{ steps.gitversion.outputs.PreReleaseLabel }}") {
            $releaseName = "${{ steps.gitversion.outputs.SemVer }}"
          } else {
            $releaseName = "${{ steps.gitversion.outputs.MajorMinorPatch }}"
          }
          $isPre = if ("${{ steps.gitversion.outputs.PreReleaseLabel }}") { "true" } else { "false" }

          # Velopack channels: stable releases feed the default 'win' channel,
          # prereleases feed 'win-{label}' (e.g. 'win-alpha' for development builds).
          
          $channel = if ("${{ steps.gitversion.outputs.PreReleaseLabel }}") { "win-${{ steps.gitversion.outputs.PreReleaseLabel }}" } else { "win" }
          echo "RELEASE_NAME=$releaseName" >> $env:GITHUB_ENV
          echo "RELEASE_VERSION=$($releaseName -replace '^[vV]', '')" >> $env:GITHUB_ENV
          echo "IS_PRERELEASE=$isPre" >> $env:GITHUB_ENV
          echo "VELOPACK_CHANNEL=$channel" >> $env:GITHUB_ENV
          echo "Release name: $releaseName (prerelease: $isPre, channel: $channel)"

      - name: Verify tag version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          EXPECTED="${GITHUB_REF_NAME#v}"
          ACTUAL="${GITVERSION_SEMVER}"

          echo "Actual version: $ACTUAL"
          echo "Expected version: $EXPECTED"

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Tag version ($EXPECTED) does not match GitVersion ($ACTUAL)"
            exit 1
          fi

      - name: Build & publish
        run: dotnet publish --configuration Release -o publish -r win-x64 -p:Version=$env:RELEASE_VERSION

      - name: Install Velopack CLI
        run: |
          dotnet tool install -g vpk

      - name: Download previous release for delta generation
        shell: pwsh
        run: |
          # --pre is required on prerelease channels: without it the download
          # source filters to stable releases only and finds no matching feed.
          $dlArgs = @(
            "download", "github",
            "--repoUrl", "https://github.com/${{ github.repository }}",
            "--token", "${{ secrets.GITHUB_TOKEN }}",
            "--channel", "$env:VELOPACK_CHANNEL"
          )
          if ($env:IS_PRERELEASE -eq "true") { $dlArgs += "--pre" }
          vpk @dlArgs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create Velopack package with deltas
        run: |
          vpk pack -u QuestLog -v $env:RELEASE_VERSION -p publish -r win-x64 --channel $env:VELOPACK_CHANNEL

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh api "repos/${{ github.repository }}/releases/generate-notes"
          -f tag_name="$env:RELEASE_NAME"
          -f target_commitish="${{ github.sha }}"
          --jq .body
          | Out-File -FilePath release-notes.md -Encoding utf8

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $grmArgs = @(
            "create",
            "--token", "${{ secrets.GITHUB_TOKEN }}",
            "--owner", "${{ github.repository_owner }}",
            "--repository", "${{ github.event.repository.name }}",
            "--name", "$env:RELEASE_NAME",
            "--inputFilePath", "release-notes.md",
            "--targetcommitish", "${{ github.sha }}"
          )
          if ($env:IS_PRERELEASE -eq "true") { $grmArgs += "--pre" }
          dotnet gitreleasemanager @grmArgs

      - name: Upload Velopack package to release
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --tag $env:RELEASE_NAME --token ${{ secrets.GITHUB_TOKEN }} --merge --channel $env:VELOPACK_CHANNEL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet gitreleasemanager publish
          --token ${{ secrets.GITHUB_TOKEN }}
          --owner ${{ github.repository_owner }}
          --repository ${{ github.event.repository.name }}
          --tagName $env:RELEASE_NAME
